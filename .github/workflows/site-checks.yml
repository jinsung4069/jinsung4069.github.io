name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the site and committed game export
        run: python scripts/check_site.py
      - name: Check validator regressions
        run: python -B -m unittest discover -s tests
      - name: Check game rules and all reachable states
        run: node --test apps/alligator-chess/tests/game.test.mjs
      - name: Check shared JavaScript syntax
        run: |
          node --check js/preferences.js
          node --check js/main.js
          node --check js/clean-url.js
